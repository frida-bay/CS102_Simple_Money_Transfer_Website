<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetSanctum - Transfer Money</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="transfer-money">

<div class="top-right-links">
  <a href="dashboard.html">Go Back to Dashboard</a>
</div>

<div class="center-content">
  <h1>Transfer Money</h1>
  <form id="transferForm">
    <input type="email" id="receiverEmail" placeholder="Receiver's Email" required>
    <input type="number" id="amount" placeholder="Amount" required>
    <button type="submit" class="btn-neon">Send</button>
  </form>
  <p id="transferMessage" style="margin-top: 15px; font-size: 18px;"></p>
</div>

<script>
  const user = JSON.parse(localStorage.getItem('currentUser'));
  if (!user) {
    window.location.href = 'login.html';
  }

  document.getElementById('transferForm').addEventListener('submit', async function (e) {
    e.preventDefault();

    const receiverEmail = document.getElementById('receiverEmail').value.trim();
    const amount = parseFloat(document.getElementById('amount').value.trim());

    try {
      const res = await fetch('/api/transfer', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          senderEmail: user.email,
          receiverEmail,
          amount
        })
      });

      const data = await res.json();

      if (data.success) {
        document.getElementById('transferMessage').innerText = 'Transfer successful!';
        if (data.user) {
          localStorage.setItem('currentUser', JSON.stringify(data.user));
        }
      } else {
        document.getElementById('transferMessage').innerText = data.message || 'Transfer failed.';
      }
    } catch (err) {
      document.getElementById('transferMessage').innerText = 'Server error. Please try again.';
      console.error(err);
    }
  });
</script>

</body>
</html>
